<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piniso — Study Desk</title>
<link rel="icon" href="../assets/icons/icon32.png">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="katex.css">
<style>
  body{min-height:100vh}
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  @media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static!important;height:auto!important}}
  .side{position:sticky;top:0;height:100vh;border-right:var(--bw) solid var(--ink);padding:18px 14px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 14px;margin-bottom:6px;border-bottom:1.5px dashed var(--line)}
  .brand .pet{width:56px;margin:-6px 0 -8px}
  .brand h1{font-size:32px;line-height:.9}
  .brand small{display:block;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em;margin-top:4px}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1.5px solid transparent;text-decoration:none;font-weight:600;font-size:14px}
  .nav:hover{border-color:var(--ink);background:var(--paper2)}
  .nav.on{background:var(--ink);color:var(--paper)}
  .nav .cnt{margin-left:auto;font:700 11px var(--f-mono);background:var(--acc);color:var(--acc-ink);border:1.5px solid var(--ink);border-radius:99px;padding:1px 6px}
  .side .bottom{margin-top:auto;font-size:11.5px;color:var(--muted);padding:8px}
  main{padding:32px 40px 80px;max-width:1080px;width:100%}
  @media (max-width:860px){main{padding:20px}}
  .ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px}
  .ph h2{font-size:46px;line-height:.95}
  .ph p{margin:6px 0 0;color:var(--muted);max-width:640px}
  .prov{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0 4px}
  .pc{text-align:left;padding:12px 14px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--paper2);position:relative}
  .pc b{display:block;font-size:15px}
  .pc small{color:var(--muted);display:block;margin-top:2px;line-height:1.35}
  .pc.on{background:var(--acc);color:var(--acc-ink);box-shadow:var(--sh2)}
  .pc.on small{color:inherit;opacity:.8}
  .pc .tag{position:absolute;top:-9px;right:10px;font:700 10px var(--f-mono);background:var(--ink);color:var(--paper);padding:2px 6px;border-radius:5px}
  .keyrow{display:flex;gap:8px;align-items:center}
  .res{font-size:12.5px;margin-top:6px}
  .res.ok{color:#137a3f}.res.bad{color:#b3261e}
  .studio{display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
  @media (max-width:980px){.studio{grid-template-columns:1fr}}
  .stage{position:sticky;top:20px;padding:20px;text-align:center}
  .stage .petbig{display:flex;justify-content:center;padding:26px 0 6px}
  .stage .bub{display:inline-block;max-width:280px;font:400 22px/1.15 var(--f-hand);padding:10px 14px;border:var(--bw) solid var(--ink);border-radius:var(--r1);background:var(--paper2);box-shadow:var(--sh2)}
  .moods{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px}
  .moods .chip{padding:5px 8px;font-size:11px}
  .themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .th{padding:0;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;text-align:left;background:none}
  .th .sw4{height:58px;display:flex;align-items:flex-end;padding:6px;gap:4px;position:relative}
  .th .sw4 i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(0,0,0,.4)}
  .th .tp{position:absolute;right:4px;bottom:-4px;width:50px}
  .th .nm{padding:7px 9px;font-weight:700;font-size:13px;border-top:var(--bw) solid var(--ink);background:var(--paper2)}
  .th .nm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
  .th.on{box-shadow:0 0 0 4px var(--acc),var(--sh2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px}
  .colors label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .sess{display:flex;gap:14px;align-items:center;padding:12px 14px;border-bottom:1.5px dashed var(--line)}
  .sess:last-child{border-bottom:none}
  .sess .t{flex:1;min-width:0}
  .sess .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rev{max-width:640px;margin:0 auto}
  .fcard{min-height:250px;padding:28px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:20px;line-height:1.4;position:relative}
  .fcard .lab{position:absolute;top:12px;left:16px;font:700 11px var(--f-mono);letter-spacing:.08em;color:var(--muted)}
  .fcard .src{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:var(--muted)}
  .fcard .ans{margin-top:16px;padding-top:16px;border-top:2px dashed var(--line)}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .grades .btn{flex-direction:column;gap:3px;padding:10px 6px}
  .grades .btn small{font:500 11px var(--f-mono);opacity:.7}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;overflow-x:auto;padding-bottom:4px}
  .heat i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);background:var(--paper2)}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .bd{padding:12px;border:1.5px solid var(--ink);border-radius:14px;background:var(--paper2);text-align:center}
  .bd .e{font-size:30px;line-height:1.2}
  .bd b{display:block;font-size:13.5px}
  .bd small{color:var(--muted);font-size:11.5px}
  .bd.off{opacity:.38;filter:grayscale(1)}
  .wiz{max-width:640px;margin:40px auto;padding:30px 34px;text-align:center}
  .wiz .petbig{display:flex;justify-content:center;margin:-8px 0 6px}
  .wiz h2{font-size:44px;line-height:1}
  .wiz p{color:var(--muted);margin:10px auto 18px;max-width:460px}
  .steps{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
  .steps i{width:30px;height:7px;border-radius:9px;border:1.5px solid var(--ink);background:var(--paper)}
  .steps i.on{background:var(--ink)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl td,.tbl th{padding:7px 8px;border-bottom:1px dashed var(--line);text-align:left}
  .tbl th{font:700 11px var(--f-mono);letter-spacing:.06em;color:var(--muted)}
  .sfxgrid{display:flex;flex-wrap:wrap;gap:6px}
  .kb{font:500 12px var(--f-mono);border:1.5px solid var(--ink);border-radius:6px;padding:2px 7px;background:var(--paper2)}
  ul.clean{margin:6px 0;padding-left:1.2em}
  ul.clean li{margin:4px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="pet" id="brandPet"></div><div><h1>piniso</h1><small id="ver">STUDY BUDDY</small></div></div>
    <nav id="nav"></nav>
    <div class="bottom">Made with ✏️ by <b>Eka</b>. Your notes & keys stay on this device.</div>
  </aside>
  <main id="main"></main>
</div>
<script src="../vendor/katex/katex.min.js"></script>
<script src="../shared/defaults.js"></script>
<script src="../shared/store.js"></script>
<script src="../shared/md.js"></script>
<script src="../shared/icons.js"></script>
<script src="../shared/lines.js"></script>
<script src="../shared/pet.js"></script>
<script src="../vendor/three/pz3.min.js"></script>
<script src="../shared/pet3d.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/device-ai.js"></script>
<script src="common.js"></script>
<script src="options.js"></script>
</body>
</html>
