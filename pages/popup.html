<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Piniso</title>
<link rel="stylesheet" href="page.css">
<style>
  body{width:360px;min-height:420px;background:var(--paper);background-image:var(--grain)}
  .top{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:var(--bw) solid var(--ink)}
  .top .pet{width:62px;flex:none;margin:-6px 0 -10px}
  .top h1{font-size:26px;line-height:1}
  .top .hand{font-size:19px;color:var(--muted)}
  .wrap{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
  .now{padding:12px 14px}
  .now .t{font:600 14px/1.3 var(--f-ui);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
  .acts .btn{justify-content:flex-start;font-size:12.5px;padding:8px 10px}
  .acts .btn.full{grid-column:1/-1;justify-content:center}
  .today{display:flex;gap:12px;align-items:center;padding:12px 14px}
  .ring{width:70px;height:70px;flex:none}
  .today b{font:400 30px/1 var(--f-serif)}
  .warn.ok{background:color-mix(in srgb,#4DD48A 30%,var(--paper2));color:var(--ink)}
  .warn{padding:10px 12px;background:var(--acc);color:var(--acc-ink);border:var(--bw) solid var(--ink);border-radius:12px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
  .tg .setrow{padding:8px 0}
  .foot{display:flex;gap:8px;padding:0 14px 14px}
  .cont{padding:10px 12px}
  .more{padding:8px 12px}
  .more summary{cursor:pointer;font:700 13px var(--f-ui);padding:4px 0;list-style:none}
  .more summary::-webkit-details-marker{display:none}
  .more[open] summary{margin-bottom:6px}
  .more .tg{box-shadow:none!important;border:0!important;padding:0!important;background:none!important}
  .more .btn.wide{margin-top:8px}
  .hero{font-size:16px!important;padding:12px!important;background:linear-gradient(135deg,#FFD23F,#FF9F1C)!important;color:#1c1b18!important;border:2px solid var(--ink)!important;box-shadow:3px 3px 0 var(--ink)!important}
  .hero:hover{transform:translateY(-1px) rotate(-.5deg)}
  .mis{padding:10px 12px}
  .mis .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .mis .mi{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:4px 2px;font:500 13px var(--f-ui);color:var(--ink);cursor:pointer;text-align:left;border-radius:6px}
  .mis .mi:hover{background:var(--paper)}
  .mis .mi .ml{flex:1}
  .mis .mi.done .ml{text-decoration:line-through;opacity:.6}
  .mis .ex{margin-top:6px;padding-top:6px;border-top:1.5px dashed var(--line);font-size:12.5px}
  .gcard{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .gcard .gl{font-size:13px}
  .lrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .lrow label{display:flex;gap:4px;align-items:center;cursor:pointer}
  .crow{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 9px 9px;margin-top:6px;cursor:pointer;overflow:hidden;color:var(--ink)}
  .crow:hover{border-color:var(--ink)}
  .crow .ct{font:600 12.5px/1.3 var(--f-ui);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .crow .cm{font-size:11px;color:var(--muted)}
  .crow .cp{position:absolute;left:0;bottom:0;height:3px;background:#FF3B3B}
  .kbd{font:500 11px var(--f-mono);border:1.5px solid var(--ink);border-radius:5px;padding:1px 5px;background:var(--paper2)}
</style>
</head>
<body>
  <div class="top">
    <div class="pet" id="pet"></div>
    <div class="sp">
      <h1 id="name">Piniso</h1>
      <div class="hand" id="hello">ready to study?</div>
    </div>
    <button class="btn ghost sm" id="gear" title="Dashboard"></button>
  </div>
  <div class="wrap" id="wrap"></div>
  <div class="foot"><button class="btn sm wide" id="dash">Open dashboard</button></div>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/store.js"></script>
  <script src="../shared/md.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="../shared/lines.js"></script>
  <script src="../shared/pet.js"></script>
<script src="../vendor/three/pz3.min.js"></script>
<script src="../shared/pet3d.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
